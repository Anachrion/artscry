# Kamal deploy config for Artscry. Docs: https://kamal-deploy.org
#
# Runs on the same Hetzner VM as carnevale-backend (x86, 2 vCPU / 4 GB). kamal-proxy is shared
# between both apps and routes requests by host name, each host getting its own Let's Encrypt cert.
# No database server: SQLite files live in the artscry_storage volume.

service: artscry

# Image lives in GitHub Container Registry (must be lowercase).
image: anachrion/artscry

servers:
  web:
    - 62.238.30.155

# "artscry.<ip>.sslip.io" resolves to the server's IP with no DNS setup, so the cert works right away.
# To use a real domain later, point its DNS at the server and add/replace it here.
proxy:
  ssl: true
  host: artscry.62.238.30.155.sslip.io
  # app_port defaults to 80, where Thruster listens.

registry:
  server: ghcr.io
  username: Anachrion
  password:
    - KAMAL_REGISTRY_PASSWORD   # GitHub PAT with write:packages (see .kamal/secrets)

# The server is amd64 and the Mac arm64. Build with Colima's Docker daemon (driver: docker) so the
# amd64 steps run through Rosetta instead of Kamal's default BuildKit container, which uses QEMU
# and is several times slower. Same setup as carnevale-backend (see its docs/DEPLOYMENT.md).
builder:
  arch: amd64
  driver: docker

env:
  clear:
    # Run Solid Queue inside Puma: it runs the weekly set catalog import (config/recurring.yml).
    SOLID_QUEUE_IN_PUMA: true
    # Small app sharing the box with carnevale-backend: one Puma process is plenty.
    WEB_CONCURRENCY: 1
  secret:
    - RAILS_MASTER_KEY

# SQLite databases (app, cache, queue) persist across deploys here.
volumes:
  - "artscry_storage:/rails/storage"

# Bridge fingerprinted assets between versions to avoid 404s on in-flight requests during deploys.
asset_path: /rails/public/assets

# Shortcuts: `bin/kamal console`, `bin/kamal logs`, `bin/kamal catalog`…
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
  # Import the set catalog now instead of waiting for Monday's job (needed once after the first deploy).
  catalog: app exec --reuse "bin/rails catalog:import"
